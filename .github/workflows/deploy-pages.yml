name: Deploy shuukatsu-app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'shuukatsu-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: 'true'
      NEXT_PUBLIC_BASE_PATH: /Procson
      # 外部バックエンド（shuukatu-app-back / Cloudflare Tunnel）を叩かせる。
      # 未設定だと apiUrl() が同一オリジン(=静的404)にフォールバックしモックのままになる。
      NEXT_PUBLIC_API_BASE: https://shuukatsu-back.dreamyard.cc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuukatsu-app/package-lock.json
      - run: npm ci
        working-directory: shuukatsu-app
      # build:static が app/api（静的書き出し非対応の動的ルート）を退避してから
      # next build を実行する。
      - run: npm run build:static
        working-directory: shuukatsu-app
      - run: touch shuukatsu-app/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shuukatsu-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
