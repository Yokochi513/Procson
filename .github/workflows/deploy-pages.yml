name: Deploy shuukatsu-app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'shuukatsu-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: 'true'
      NEXT_PUBLIC_BASE_PATH: /Procson
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shuukatsu-app/package-lock.json
      - run: npm ci
        working-directory: shuukatsu-app
      # 静的書き出しに API ルートは含められないため、ビルド前に取り除く。
      # ES の AI コメントはクライアント側のモックにフォールバックする。
      - run: rm -rf app/api
        working-directory: shuukatsu-app
      - run: npm run build
        working-directory: shuukatsu-app
      - run: touch shuukatsu-app/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shuukatsu-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
